# Tests TaskHaven and builds the Android app on every push. The APK (and, when signed, the App
# Bundle for Google Play) are under the run's "Artifacts" (Actions tab → the run → TaskHaven-apk);
# publishing a release also attaches them there.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    your signing key (tools/make-keystore.sh), so each APK installs over the last
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          its alias (taskhaven if not set)
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Web pages filled in (privacy policy, terms, deleting an account)
        run: |
          if grep -l '\[Your name\]\|\[your contact email\]' docs/*.html; then
            echo "::warning::docs/ still has [Your name] / [your contact email] to fill in before publishing on Google Play."
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Walk through the app in a browser
        run: npm run e2e

  server:
    # the app against a real Vikunja server: its release (checked against its checksum), with SQLite
    runs-on: ubuntu-latest
    env:
      VIKUNJA_VERSION: v2.7.1
      VIKUNJA_SHA256: 2d0b64a477341977958067a42a32655b74f5e72e6eb02f57942faa19d9ee76ad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A Vikunja server
        run: |
          mkdir -p "$RUNNER_TEMP/vikunja" && cd "$RUNNER_TEMP/vikunja"
          curl -fsSL -o vikunja.zip "https://github.com/go-vikunja/vikunja/releases/download/$VIKUNJA_VERSION/vikunja-$VIKUNJA_VERSION-linux-amd64-full.zip"
          echo "$VIKUNJA_SHA256  vikunja.zip" | sha256sum -c -
          unzip -q vikunja.zip
          cat > config.yml <<'YAML'
          service:
            secret: "taskhaven-ci-only-secret-0123456789abcdef"
            interface: "127.0.0.1:3456"
            publicurl: "http://localhost:3456"
            enableregistration: true
          database:
            type: "sqlite"
            path: "./vikunja.db"
          cors:
            enable: true
            origins:
              - "http://127.0.0.1:*"
              - "http://localhost:*"
          mailer:
            enabled: false
          ratelimit:
            noauthlimit: 1000
          log:
            level: "WARNING"
          YAML
          chmod +x "vikunja-$VIKUNJA_VERSION-linux-amd64"
          nohup "./vikunja-$VIKUNJA_VERSION-linux-amd64" web --config ./config.yml > vikunja.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3456/api/v1/info > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:3456/api/v1/info
      - name: The data layer against it
        run: npm run test:server
        env:
          VIKUNJA_URL: http://127.0.0.1:3456
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The app in a browser against it
        run: npm run e2e:server
        env:
          VIKUNJA_URL: http://127.0.0.1:3456
      - name: The server's log, if something failed
        if: failure()
        run: cat "$RUNNER_TEMP/vikunja/vikunja.log"

  apk:
    needs: [test, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Signing key (if the ANDROID_KEYSTORE_BASE64 secret is set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/taskhaven.jks"
            echo "TASKHAVEN_KEYSTORE=$RUNNER_TEMP/taskhaven.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          TASKHAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASKHAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASKHAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          if [ -n "$TASKHAVEN_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "../TaskHaven-$VERSION.apk"
            cp app/build/outputs/bundle/release/app-release.aab "../TaskHaven-$VERSION.aab"
          else
            echo "::warning::No signing key set: this is a debug build. Set ANDROID_KEYSTORE_BASE64 so updates install over it."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../TaskHaven-$VERSION-debug.apk"
          fi
          cd .. && ls TaskHaven-*.apk TaskHaven-*.aab 2>/dev/null | xargs sha256sum | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TaskHaven-apk
          path: |
            TaskHaven-*.apk
            TaskHaven-*.aab
            SHA256SUMS.txt
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" TaskHaven-*.apk $(ls TaskHaven-*.aab 2>/dev/null) SHA256SUMS.txt --clobber
