# Tests TaskHaven and builds the Android and iPhone apps on every push. They're under the run's
# "Artifacts" (Actions tab → the run → TaskHaven-apk, TaskHaven-ipa). A push to main also puts both
# on a draft release for package.json's version: check it, then publish it on the Releases page.
#
# The iPhone app (.ipa) isn't signed: people install it with AltStore, SideStore or Sideloadly,
# which sign it with their own Apple ID.
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    your signing key (tools/make-keystore.sh), so each APK installs over the last
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          its alias (taskhaven if not set)
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # Playwright's browsers need an Ubuntu it supports (not yet 26.04, ubuntu-latest's)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Walk through the app in a browser
        run: npm run e2e

  server:
    # the app against a real Vikunja server: its release (checked against its checksum), with SQLite
    runs-on: ubuntu-24.04
    env:
      VIKUNJA_VERSION: v2.7.1
      VIKUNJA_SHA256: 2d0b64a477341977958067a42a32655b74f5e72e6eb02f57942faa19d9ee76ad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: A Vikunja server
        run: |
          mkdir -p "$RUNNER_TEMP/vikunja" && cd "$RUNNER_TEMP/vikunja"
          curl -fsSL -o vikunja.zip "https://github.com/go-vikunja/vikunja/releases/download/$VIKUNJA_VERSION/vikunja-$VIKUNJA_VERSION-linux-amd64-full.zip"
          echo "$VIKUNJA_SHA256  vikunja.zip" | sha256sum -c -
          unzip -q vikunja.zip
          cat > config.yml <<'YAML'
          service:
            secret: "taskhaven-ci-only-secret-0123456789abcdef"
            interface: "127.0.0.1:3456"
            publicurl: "http://localhost:3456"
            enableregistration: true
          database:
            type: "sqlite"
            path: "./vikunja.db"
          cors:
            enable: true
            origins:
              - "http://127.0.0.1:*"
              - "http://localhost:*"
          mailer:
            enabled: false
          ratelimit:
            noauthlimit: 1000
          log:
            level: "WARNING"
          YAML
          chmod +x "vikunja-$VIKUNJA_VERSION-linux-amd64"
          nohup "./vikunja-$VIKUNJA_VERSION-linux-amd64" web --config ./config.yml > vikunja.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3456/api/v1/info > /dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:3456/api/v1/info
      - name: The data layer against it
        run: npm run test:server
        env:
          VIKUNJA_URL: http://127.0.0.1:3456
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: The app in a browser against it
        run: npm run e2e:server
        env:
          VIKUNJA_URL: http://127.0.0.1:3456
      - name: The server's log, if something failed
        if: failure()
        run: cat "$RUNNER_TEMP/vikunja/vikunja.log"

  apk:
    needs: [test, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (the runner's own, or Google's command-line tools if it has none)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKM" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o "$RUNNER_TEMP/tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q "$RUNNER_TEMP/tools.zip" -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Signing key (if the ANDROID_KEYSTORE_BASE64 secret is set)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/taskhaven.jks"
            echo "TASKHAVEN_KEYSTORE=$RUNNER_TEMP/taskhaven.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          TASKHAVEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TASKHAVEN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TASKHAVEN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          if [ -n "$TASKHAVEN_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../TaskHaven-$VERSION.apk"
          else
            echo "::warning::No signing key set: this is a debug build. Set ANDROID_KEYSTORE_BASE64 so updates install over it."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../TaskHaven-$VERSION-debug.apk"
          fi
          cd .. && sha256sum TaskHaven-*.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TaskHaven-apk
          path: |
            TaskHaven-*.apk
            SHA256SUMS.txt

  ipa:
    needs: [test, server]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build the iPhone app
        run: |
          set -o pipefail
          xcodebuild -version
          VERSION=$(node -p "require('./package.json').version")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" -quiet \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          # An .ipa is the app in a Payload folder, zipped
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/ios/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/TaskHaven-$VERSION.ipa" Payload)
          shasum -a 256 TaskHaven-*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: TaskHaven-ipa
          path: TaskHaven-*.ipa

  draft:
    # both apps, with one list of their checksums, on a draft release to check and publish
    needs: [apk, ipa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true
      - name: Draft release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cd apps
          sha256sum TaskHaven-*.apk TaskHaven-*.ipa | tee SHA256SUMS.txt
          FILES="$(ls TaskHaven-*.apk TaskHaven-*.ipa) SHA256SUMS.txt"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              # The draft's tag follows the newest build, so the source matches the apps
              gh release edit "$TAG" --target "$GITHUB_SHA"
              # Drop files an earlier build of this version left behind (like a debug APK)
              for old in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
                [ -f "$old" ] || gh release delete-asset "$TAG" "$old" --yes
              done
              gh release upload "$TAG" $FILES --clobber
            else
              echo "::notice::$TAG is already published, so it was left alone. Raise the version in package.json for a new draft."
            fi
          else
            # One draft at a time: a new version replaces drafts of older ones that were never published
            for old in $(gh release list --limit 50 --json tagName,isDraft -q '.[] | select(.isDraft) | .tagName'); do
              [ "$old" = "$TAG" ] || gh release delete "$old" --yes
            done
            gh release create "$TAG" $FILES --draft --target "$GITHUB_SHA" \
              --title "TaskHaven $VERSION" --notes "TaskHaven $VERSION"
          fi
