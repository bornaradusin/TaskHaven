# One-off: opens the iPhone app on a simulator and prints screenshots into the log.
name: iPhone check

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" -quiet \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run it
        run: |
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 17 Pro \(|iPhone 17 \(|iPhone 16 \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          mkdir -p shots
          shot() { sleep "$2"; xcrun simctl io "$DEVICE" screenshot "shots/$1.png" >/dev/null; echo "shot $1"; }
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" io.github.bornaradusin.taskhaven
          shot launch 0.4
          shot setup 12
          # the demo: the same app with the demo chosen before it starts
          sed -i '' 's#<head>#<head><script>localStorage.setItem("taskhaven.demo","true")</script>#' "$APP/public/index.html"
          xcrun simctl terminate "$DEVICE" io.github.bornaradusin.taskhaven || true
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" io.github.bornaradusin.taskhaven
          shot demo 15
          xcrun simctl ui "$DEVICE" appearance dark
          shot demo-dark 4
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "App"' 2>/dev/null | grep -iE "⚡️|error|exception" | grep -v "Unable to simultaneously" | tail -60 || true
      - name: Screenshots into the log
        run: |
          cd shots
          for f in *.png; do
            sips -Z 1000 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "=====BEGIN ${f%.png}.jpg====="
            base64 -i "${f%.png}.jpg" | fold -w 4000
            echo "=====END ${f%.png}.jpg====="
          done
